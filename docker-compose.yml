services:
  # ===== Frontend Apps =====
  web-g-bookedai:
    build:
      context: .
      dockerfile: apps/web-g-bookedai/Dockerfile
    ports: ['3000:3000']
    environment:
      - NEXT_PUBLIC_API_URL=https://api.g.bookedai.au
      - NEXT_PUBLIC_GA4_ID=${GA4_MEASUREMENT_ID}
      - NEXT_PUBLIC_GTM_ID=${GTM_ID}
    depends_on: [api]

  web-longcare:
    build:
      context: .
      dockerfile: apps/web-longcare/Dockerfile
    ports: ['3001:3000']
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080

  booking-web:
    build:
      context: .
      dockerfile: apps/booking-web/Dockerfile
    ports: ['3002:3000']
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_STRIPE_KEY=${STRIPE_PUBLISHABLE_KEY}
    depends_on: [api]

  user-app:
    build:
      context: .
      dockerfile: apps/user-app/Dockerfile
    ports: ['3003:3000']
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on: [api]

  admin-app:
    build:
      context: .
      dockerfile: apps/admin-app/Dockerfile
    ports: ['3004:3000']
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on: [api]

  # ===== Backend Services =====
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports: ['8180:8080']
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./credentials:/app/credentials:ro
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://bookedai:localpass@postgres:5432/longcare
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/google-service-account.json
      - CEO_EMAIL=${CEO_EMAIL:-ceo@longcare.au}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - BANK_TRANSFER_PAYID=${BANK_TRANSFER_PAYID:-ceo@longcare.au}
      - BANK_TRANSFER_ACCOUNT_NAME=${BANK_TRANSFER_ACCOUNT_NAME:-Longcare AU}
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,https://g.bookedai.au,https://admin.g.bookedai.au,https://booking.g.bookedai.au,https://app.g.bookedai.au,https://api.g.bookedai.au
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    ports: ['8081:8080']
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on: [api]

  design-agent:
    build:
      context: .
      dockerfile: services/design-agent/Dockerfile
    ports: ['8084:8080']
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    ports: ['8082:8080']
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./credentials:/app/credentials:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/google-service-account.json
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-auschain-489904}
      - CEO_EMAIL=${CEO_EMAIL:-ceo@longcare.au}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-noreply@longcare.au}

  drive-sync:
    build:
      context: .
      dockerfile: services/drive-sync/Dockerfile
    ports: ['8083:8080']
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./credentials:/app/credentials:ro
      - ./docs:/app/docs:ro
    environment:
      - DATABASE_URL=postgresql://bookedai:localpass@postgres:5432/longcare
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-auschain-489904}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/google-service-account.json
      - CEO_EMAIL=${CEO_EMAIL:-ceo@longcare.au}
      - DOCS_ROOT=/app/docs
    depends_on:
      postgres:
        condition: service_healthy

  # ===== Infrastructure =====
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bookedai
      POSTGRES_PASSWORD: localpass
      POSTGRES_DB: longcare
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bookedai -d longcare']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
