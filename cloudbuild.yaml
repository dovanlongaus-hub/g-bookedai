steps:
  # Step 1: Install dependencies
  - name: 'node:20-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        corepack enable && corepack prepare pnpm@latest --activate
        pnpm install --no-frozen-lockfile
    id: 'install'

  # Step 2: Run tests
  - name: 'node:20-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        corepack enable && corepack prepare pnpm@latest --activate
        pnpm --filter @bookedai/api test
    id: 'test'
    waitFor: ['install']

  # === BUILD SERVICES (parallel) ===
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGISTRY}/${PROJECT_ID}/bookedai-services/api:${SHORT_SHA}', '-t', '${_REGISTRY}/${PROJECT_ID}/bookedai-services/api:latest', 'services/api']
    id: 'build-api'
    waitFor: ['test']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGISTRY}/${PROJECT_ID}/bookedai-services/agent:${SHORT_SHA}', '-t', '${_REGISTRY}/${PROJECT_ID}/bookedai-services/agent:latest', 'services/agent']
    id: 'build-agent'
    waitFor: ['test']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGISTRY}/${PROJECT_ID}/bookedai-services/web-g-bookedai:${SHORT_SHA}', '-t', '${_REGISTRY}/${PROJECT_ID}/bookedai-services/web-g-bookedai:latest', '--build-arg', 'NEXT_PUBLIC_API_URL=https://api-g-bookedai-${_CLOUD_RUN_SUFFIX}.run.app', 'apps/web-g-bookedai']
    id: 'build-web-g'
    waitFor: ['test']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGISTRY}/${PROJECT_ID}/bookedai-services/web-longcare:${SHORT_SHA}', '-t', '${_REGISTRY}/${PROJECT_ID}/bookedai-services/web-longcare:latest', 'apps/web-longcare']
    id: 'build-web-lc'
    waitFor: ['test']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGISTRY}/${PROJECT_ID}/bookedai-services/booking-web:${SHORT_SHA}'
      - '-t'
      - '${_REGISTRY}/${PROJECT_ID}/bookedai-services/booking-web:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=https://api-g-bookedai-${_CLOUD_RUN_SUFFIX}.run.app'
      - '--build-arg'
      - 'NEXT_PUBLIC_BANK_NAME=${_BANK_NAME}'
      - '--build-arg'
      - 'NEXT_PUBLIC_BANK_PAYID=${_BANK_PAYID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_BANK_BSB=${_BANK_BSB}'
      - '--build-arg'
      - 'NEXT_PUBLIC_BANK_ACCOUNT_NUMBER=${_BANK_ACCOUNT_NUMBER}'
      - '--build-arg'
      - 'NEXT_PUBLIC_BANK_ACCOUNT_NAME=${_BANK_ACCOUNT_NAME}'
      - '--build-arg'
      - 'NEXT_PUBLIC_VIETQR_BANK_CODE=${_VIETQR_BANK_CODE}'
      - '--build-arg'
      - 'NEXT_PUBLIC_VIETQR_ACCOUNT_NUMBER=${_VIETQR_ACCOUNT_NUMBER}'
      - '--build-arg'
      - 'NEXT_PUBLIC_VIETQR_ACCOUNT_NAME=${_VIETQR_ACCOUNT_NAME}'
      - 'apps/booking-web'
    id: 'build-booking'
    waitFor: ['test']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGISTRY}/${PROJECT_ID}/bookedai-services/user-app:${SHORT_SHA}', '-t', '${_REGISTRY}/${PROJECT_ID}/bookedai-services/user-app:latest', '--build-arg', 'NEXT_PUBLIC_API_URL=https://api-g-bookedai-${_CLOUD_RUN_SUFFIX}.run.app', 'apps/user-app']
    id: 'build-user-app'
    waitFor: ['test']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGISTRY}/${PROJECT_ID}/bookedai-services/admin-app:${SHORT_SHA}', '-t', '${_REGISTRY}/${PROJECT_ID}/bookedai-services/admin-app:latest', '--build-arg', 'NEXT_PUBLIC_API_URL=https://api-g-bookedai-${_CLOUD_RUN_SUFFIX}.run.app', 'apps/admin-app']
    id: 'build-admin-app'
    waitFor: ['test']

  # === PUSH ALL IMAGES (parallel) ===
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGISTRY}/${PROJECT_ID}/bookedai-services/api']
    id: 'push-api'
    waitFor: ['build-api']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGISTRY}/${PROJECT_ID}/bookedai-services/agent']
    id: 'push-agent'
    waitFor: ['build-agent']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGISTRY}/${PROJECT_ID}/bookedai-services/web-g-bookedai']
    id: 'push-web-g'
    waitFor: ['build-web-g']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGISTRY}/${PROJECT_ID}/bookedai-services/web-longcare']
    id: 'push-web-lc'
    waitFor: ['build-web-lc']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGISTRY}/${PROJECT_ID}/bookedai-services/booking-web']
    id: 'push-booking'
    waitFor: ['build-booking']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGISTRY}/${PROJECT_ID}/bookedai-services/user-app']
    id: 'push-user-app'
    waitFor: ['build-user-app']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGISTRY}/${PROJECT_ID}/bookedai-services/admin-app']
    id: 'push-admin-app'
    waitFor: ['build-admin-app']

  # === DEPLOY BACKEND TO CLOUD RUN (with secrets) ===
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'api-g-bookedai'
      - '--image=${_REGISTRY}/${PROJECT_ID}/bookedai-services/api:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=8080'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=NODE_ENV=production,ALLOWED_ORIGINS=https://g.bookedai.au,https://longcare.au,https://book.longcare.au,https://app.longcare.au,https://admin.longcare.au,STRIPE_PAYMENT_METHODS=${_STRIPE_PAYMENT_METHODS},BANK_TRANSFER_BANK_NAME=${_BANK_NAME},BANK_TRANSFER_PAYID=${_BANK_PAYID},BANK_TRANSFER_ACCOUNT_NAME=${_BANK_ACCOUNT_NAME},PAY_ON_ARRIVAL_ENABLED=${_PAY_ON_ARRIVAL_ENABLED}'
      - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,BANK_TRANSFER_BSB=BANK_TRANSFER_BSB:latest,BANK_TRANSFER_ACCOUNT_NUMBER=BANK_TRANSFER_ACCOUNT_NUMBER:latest,BPAY_BILLER_CODE=BPAY_BILLER_CODE:latest,VIETQR_BANK_BIN=VIETQR_BANK_BIN:latest,VIETQR_ACCOUNT_NUMBER=VIETQR_ACCOUNT_NUMBER:latest,VIETQR_ACCOUNT_NAME=VIETQR_ACCOUNT_NAME:latest'
    id: 'deploy-api'
    waitFor: ['push-api']

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'agent-g-bookedai'
      - '--image=${_REGISTRY}/${PROJECT_ID}/bookedai-services/agent:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=8080'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--set-env-vars=NODE_ENV=production'
      - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest'
    id: 'deploy-agent'
    waitFor: ['push-agent']

  # === DEPLOY FRONTEND APPS TO CLOUD RUN ===
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', 'web-g-bookedai', '--image=${_REGISTRY}/${PROJECT_ID}/bookedai-services/web-g-bookedai:${SHORT_SHA}', '--region=${_REGION}', '--platform=managed', '--port=3000', '--allow-unauthenticated', '--memory=512Mi']
    id: 'deploy-web-g'
    waitFor: ['push-web-g']

  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', 'web-longcare', '--image=${_REGISTRY}/${PROJECT_ID}/bookedai-services/web-longcare:${SHORT_SHA}', '--region=${_REGION}', '--platform=managed', '--port=3000', '--allow-unauthenticated', '--memory=512Mi']
    id: 'deploy-web-lc'
    waitFor: ['push-web-lc']

  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', 'booking-web', '--image=${_REGISTRY}/${PROJECT_ID}/bookedai-services/booking-web:${SHORT_SHA}', '--region=${_REGION}', '--platform=managed', '--port=3000', '--allow-unauthenticated', '--memory=512Mi']
    id: 'deploy-booking'
    waitFor: ['push-booking']

  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', 'user-app', '--image=${_REGISTRY}/${PROJECT_ID}/bookedai-services/user-app:${SHORT_SHA}', '--region=${_REGION}', '--platform=managed', '--port=3000', '--allow-unauthenticated', '--memory=512Mi']
    id: 'deploy-user-app'
    waitFor: ['push-user-app']

  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', 'admin-app', '--image=${_REGISTRY}/${PROJECT_ID}/bookedai-services/admin-app:${SHORT_SHA}', '--region=${_REGION}', '--platform=managed', '--port=3000', '--allow-unauthenticated', '--memory=512Mi']
    id: 'deploy-admin-app'
    waitFor: ['push-admin-app']

substitutions:
  _REGISTRY: 'australia-southeast1-docker.pkg.dev'
  _REGION: 'australia-southeast1'
  _CLOUD_RUN_SUFFIX: 'uc.a.run.app'
  # ===== Payment configuration =====
  # All values below are EMPTY in the public repo. Real values live in the
  # Cloud Build trigger config: `gcloud builds triggers update <NAME> --substitutions=KEY=val,...`
  # so they never appear in git history. Backend secrets (BSB, account number,
  # BPAY biller, Stripe keys) are loaded separately from Secret Manager — see
  # the --set-secrets line on the deploy-api step.
  _STRIPE_PAYMENT_METHODS: 'card'         # set to 'card,afterpay_clearpay' once enabled in Stripe Dashboard
  _BANK_NAME: 'Westpac'
  _BANK_PAYID: ''
  _BANK_ACCOUNT_NAME: ''
  _BANK_BSB: ''
  _BANK_ACCOUNT_NUMBER: ''
  _VIETQR_BANK_CODE: 'VCB'
  _VIETQR_ACCOUNT_NUMBER: ''
  _VIETQR_ACCOUNT_NAME: ''
  _PAY_ON_ARRIVAL_ENABLED: 'true'

images:
  - '${_REGISTRY}/${PROJECT_ID}/bookedai-services/api:${SHORT_SHA}'
  - '${_REGISTRY}/${PROJECT_ID}/bookedai-services/agent:${SHORT_SHA}'
  - '${_REGISTRY}/${PROJECT_ID}/bookedai-services/web-g-bookedai:${SHORT_SHA}'
  - '${_REGISTRY}/${PROJECT_ID}/bookedai-services/web-longcare:${SHORT_SHA}'
  - '${_REGISTRY}/${PROJECT_ID}/bookedai-services/booking-web:${SHORT_SHA}'
  - '${_REGISTRY}/${PROJECT_ID}/bookedai-services/user-app:${SHORT_SHA}'
  - '${_REGISTRY}/${PROJECT_ID}/bookedai-services/admin-app:${SHORT_SHA}'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '2400s'
