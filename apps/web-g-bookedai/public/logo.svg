<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- BookedAI Primary Logo: Icon + Text -->
  <g>
    <!-- Calendar base shape -->
    <rect x="4" y="10" width="40" height="40" rx="8" fill="url(#grad1)" />
    <!-- Calendar top hooks -->
    <rect x="14" y="6" width="3" height="10" rx="1.5" fill="#4f46e5"/>
    <rect x="27" y="6" width="3" height="10" rx="1.5" fill="#4f46e5"/>
    <!-- Grid lines representing booking slots -->
    <line x1="4" y1="22" x2="44" y2="22" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="20" y1="22" x2="20" y2="50" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="28" y1="22" x2="28" y2="50" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="36" y1="22" x2="36" y2="50" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="12" y1="22" x2="12" y2="50" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="4" y1="30" x2="44" y2="30" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <line x1="4" y1="38" x2="44" y2="38" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- AI Brain/Neural node overlay -->
    <circle cx="34" cy="38" r="8" fill="url(#grad2)" opacity="0.95"/>
    <circle cx="34" cy="38" r="3" fill="white" opacity="0.9"/>
    <circle cx="28" cy="32" r="1.5" fill="#22d3ee" opacity="0.8"/>
    <circle cx="40" cy="34" r="1.5" fill="#22d3ee" opacity="0.8"/>
    <circle cx="36" cy="44" r="1.5" fill="#22d3ee" opacity="0.8"/>
    <line x1="34" y1="38" x2="28" y2="32" stroke="#22d3ee" stroke-width="0.8" opacity="0.6"/>
    <line x1="34" y1="38" x2="40" y2="34" stroke="#22d3ee" stroke-width="0.8" opacity="0.6"/>
    <line x1="34" y1="38" x2="36" y2="44" stroke="#22d3ee" stroke-width="0.8" opacity="0.6"/>
  </g>
  <!-- Wordmark -->
  <text x="56" y="40" font-family="'Outfit', sans-serif" font-size="28" font-weight="700" fill="white" letter-spacing="-0.5">Booked</text>
  <text x="156" y="40" font-family="'Outfit', sans-serif" font-size="28" font-weight="700" fill="#22d3ee" letter-spacing="-0.5">AI</text>
  <!-- Tagline -->
  <text x="56" y="54" font-family="'Outfit', sans-serif" font-size="9" font-weight="400" fill="rgba(255,255,255,0.6)" letter-spacing="0.5">Turn customer intent into revenue</text>
  <!-- Gradients -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
</svg>
