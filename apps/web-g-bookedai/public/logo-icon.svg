<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- BookedAI Icon Only -->
  <!-- Calendar base -->
  <rect x="4" y="8" width="40" height="36" rx="8" fill="url(#iconGrad1)"/>
  <!-- Calendar hooks -->
  <rect x="14" y="4" width="3.5" height="10" rx="1.75" fill="#6366f1"/>
  <rect x="30.5" y="4" width="3.5" height="10" rx="1.75" fill="#6366f1"/>
  <!-- Divider line -->
  <line x1="4" y1="20" x2="44" y2="20" stroke="rgba(255,255,255,0.3)" stroke-width="1.2"/>
  <!-- Grid dots representing slots -->
  <circle cx="14" cy="27" r="2" fill="rgba(255,255,255,0.4)"/>
  <circle cx="24" cy="27" r="2" fill="rgba(255,255,255,0.4)"/>
  <circle cx="34" cy="27" r="2" fill="rgba(255,255,255,0.4)"/>
  <circle cx="14" cy="35" r="2" fill="rgba(255,255,255,0.4)"/>
  <!-- AI Neural core -->
  <circle cx="30" cy="35" r="9" fill="url(#iconGrad2)" opacity="0.95"/>
  <circle cx="30" cy="35" r="3.5" fill="white" opacity="0.95"/>
  <circle cx="23" cy="31" r="1.5" fill="#22d3ee" opacity="0.8"/>
  <circle cx="37" cy="33" r="1.5" fill="#22d3ee" opacity="0.8"/>
  <circle cx="32" cy="42" r="1.5" fill="#22d3ee" opacity="0.8"/>
  <line x1="30" y1="35" x2="23" y2="31" stroke="#22d3ee" stroke-width="1" opacity="0.7"/>
  <line x1="30" y1="35" x2="37" y2="33" stroke="#22d3ee" stroke-width="1" opacity="0.7"/>
  <line x1="30" y1="35" x2="32" y2="42" stroke="#22d3ee" stroke-width="1" opacity="0.7"/>
  <defs>
    <linearGradient id="iconGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="iconGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
