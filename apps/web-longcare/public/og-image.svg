<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="LongCare AU — Practical AI for Australian SMEs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#0B3B66"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="158" x2="1200" y2="158"/>
    <line x1="0" y1="316" x2="1200" y2="316"/>
    <line x1="0" y1="474" x2="1200" y2="474"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Accent bar -->
  <rect x="80" y="120" width="64" height="6" rx="3" fill="url(#accent)"/>

  <!-- Brand mark / dot -->
  <g transform="translate(80, 152)">
    <circle cx="22" cy="22" r="22" fill="#38BDF8"/>
    <text x="22" y="30" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Inter, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#0F172A">L</text>
  </g>
  <text x="148" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#E2E8F0" letter-spacing="3">LONGCARE AU</text>

  <!-- Headline -->
  <text x="80" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Inter, Arial, sans-serif" font-size="84" font-weight="800" fill="#FFFFFF" filter="url(#softShadow)">Practical AI for</text>
  <text x="80" y="408" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Inter, Arial, sans-serif" font-size="84" font-weight="800" fill="url(#accent)" filter="url(#softShadow)">Australian SMEs</text>

  <!-- Subheading -->
  <text x="80" y="468" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#94A3B8">AI mentoring &#183; Agentic implementation &#183; Measurable ROI</text>

  <!-- Footer URL -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
  <text x="80" y="580" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="22" font-weight="500" fill="#7DD3FC">longcare.au</text>
  <text x="1120" y="580" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#CBD5E1" text-anchor="end">GST-inclusive &#183; Sydney NSW</text>
</svg>
