<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" fill="none">
  <!-- LongCare Logo: Care/Learning/Growth -->
  <g>
    <!-- Outer protective arc (care/embrace) -->
    <path d="M10 42 C10 20, 24 8, 40 8" stroke="url(#lcGrad1)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M40 8 C56 8, 70 20, 70 42" stroke="url(#lcGrad2)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Growth stem -->
    <path d="M40 48 L40 22" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Leaves representing growth/learning -->
    <path d="M40 32 C34 28, 30 22, 34 18 C38 22, 38 28, 40 32" fill="#22d3ee" opacity="0.7"/>
    <path d="M40 28 C46 24, 50 18, 46 14 C42 18, 42 24, 40 28" fill="#6366f1" opacity="0.8"/>
    <!-- Head/person circle (learner) -->
    <circle cx="40" cy="16" r="5" fill="url(#lcGrad3)"/>
    <!-- Small knowledge sparkles -->
    <circle cx="28" cy="14" r="1.2" fill="#22d3ee" opacity="0.6"/>
    <circle cx="52" cy="12" r="1.2" fill="#6366f1" opacity="0.6"/>
    <circle cx="48" cy="20" r="1" fill="#22d3ee" opacity="0.5"/>
    <!-- Base/ground -->
    <path d="M30 48 C30 46, 35 44, 40 44 C45 44, 50 46, 50 48" stroke="url(#lcGrad1)" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Wordmark -->
  <text x="82" y="38" font-family="'Outfit', sans-serif" font-size="26" font-weight="600" fill="white" letter-spacing="-0.3">long</text>
  <text x="132" y="38" font-family="'Outfit', sans-serif" font-size="26" font-weight="700" fill="#22d3ee" letter-spacing="-0.3">care</text>
  <!-- Domain -->
  <text x="186" y="38" font-family="'Outfit', sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.5)">.au</text>
  <!-- Subtitle -->
  <text x="82" y="52" font-family="'Outfit', sans-serif" font-size="9" font-weight="400" fill="rgba(255,255,255,0.5)" letter-spacing="0.3">AI Mentor &amp; Learning</text>
  <!-- Gradients -->
  <defs>
    <linearGradient id="lcGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="lcGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="lcGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
</svg>
